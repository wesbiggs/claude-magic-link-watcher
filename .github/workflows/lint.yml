name: Code Quality Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Run ESLint
    runs-on: ubuntu-latest

    steps:
      # Step 1: Clone the repository onto the runner
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Install pnpm toolchain on the runner
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10 # Specify your major pnpm version (e.g., 9 or 10)
          run_install: false

      # Step 3: Set up Node.js and leverage internal pnpm caching
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm' # Enables automatic pnpm store caching

      # Step 4: Install exact dependencies matching your lockfile
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # Step 5: Execute your linting script
      - name: Run Linter
        run: pnpm run lint
